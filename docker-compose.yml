version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: rental_postgis_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: rental_management_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
    name: rental_postgres_data