version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: rental_postgis_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: rental_management_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: rental_ollama
    profiles: [ai]
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  postgres_data:
    name: rental_postgres_data
  ollama_models:
    name: rental_ollama_models
